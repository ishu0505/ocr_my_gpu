[project]
name = "gpu-my-ocr-transformers-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "jsonschema==4.26.0",
    "nvidia-ml-py==13.615.71",
    "pillow==12.3.0",
    "pymupdf==1.28.2",
    "reportlab==5.0.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==4.57.6",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# PyTorch pin preserved; Phase 1 official Qwen3-VL integration validated.
# Keep each environment's uv.lock tracked once generated.
