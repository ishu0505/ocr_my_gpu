[project]
name = "gpu-my-ocr"
version = "0.1.0"
description = "GPU-constrained OCR/VLM inference benchmark controller"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
gpu-my-ocr = "gpu_my_ocr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
